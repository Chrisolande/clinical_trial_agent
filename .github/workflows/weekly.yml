name: Weekly Maintenance

on:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  integration-weekly:
    name: Weekly integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/postgres # pragma: allowlist secret
      MEMORY_DB_DSN: postgresql://postgres:postgres@localhost:5432/postgres # pragma: allowlist secret
      DEEPSEEK_API_KEY: dummy-key-for-testing # pragma: allowlist secret
      PROFILE_HASH_SALT: ci-test-salt
      DB_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= # pragma: allowlist secret
      TENANT_ID: ci-tenant
      FACILITY_ID: ci-facility
      CLINICAL_DATA_EXTERNAL_LLM_CONSENT: "false"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run integration tests
        shell: bash
        run: |
          set +e
          uv run --all-groups pytest -m integration --maxfail=1 -q
          status=$?
          set -e

          if [ "$status" -eq 5 ]; then
            echo "No integration tests selected (-m integration). Treating as non-failure."
            exit 0
          fi

          exit "$status"

  build-and-push-weekly:
    name: Build and push weekly Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs:
      - integration-weekly

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          WEEKLY_TAG="weekly-$(date -u +%Y%m%d)"

          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "weekly_tag=${WEEKLY_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push weekly image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:weekly
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.weekly_tag }}
          cache-from: type=gha,scope=weekly-push
          cache-to: type=gha,mode=max,scope=weekly-push
