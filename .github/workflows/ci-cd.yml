name: CI / CD

on:
  push:
    branches:
      - main
      - master
      - "releases/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  QUALITY_COVERAGE_MIN: "75"

jobs:
  lint:
    name: Lint & Complexity (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dev dependencies
        run: uv sync --locked --all-groups
      - name: Run lint targets
        run: |
          uv run --all-groups ruff check .
          uv run --all-groups ruff format --check .
          uv run --all-groups mypy .
          uv run --all-groups python -m tools.complexity_gate clinical_trial_agent agents subagents tools models

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/postgres # pragma: allowlist secret
      MEMORY_DB_DSN: postgresql://postgres:postgres@localhost:5432/postgres # pragma: allowlist secret
      DEEPSEEK_API_KEY: dummy-key-for-testing
      PROFILE_HASH_SALT: ci-test-salt
      DB_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= # pragma: allowlist secret # pragma: allowlist secret
      TENANT_ID: ci-tenant
      FACILITY_ID: ci-facility
      CLINICAL_DATA_EXTERNAL_LLM_CONSENT: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run tests with coverage
        run: |
          uv run --all-groups pytest \
            --cov=clinical_trial_agent \
            --cov=agents \
            --cov=subagents \
            --cov=tools \
            --cov=models \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.QUALITY_COVERAGE_MIN }}
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dev dependencies
        run: uv sync --locked --all-groups
      - name: Enforce secret scanning baseline policy # pragma: allowlist secret
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          baseline = Path(".secrets.baseline")
          if not baseline.exists():
              print("Missing .secrets.baseline; fail-closed secret policy enforcement requires it.")
              sys.exit(1)

          data = json.loads(baseline.read_text(encoding="utf-8"))
          policies = [
              f
              for f in data.get("filters_used", [])
              if f.get("path") == "detect_secrets.filters.common.is_ignored_due_to_verification_policies"
          ]
          if not policies:
              print("Missing detect-secrets verification policy filter in .secrets.baseline.")
              sys.exit(1)

          min_level = policies[0].get("min_level")
          if not isinstance(min_level, int) or min_level < 2:
              print("detect-secrets min_level must be >= 2 for fail-closed CI policy.")
              sys.exit(1)

          print("Secret scanning baseline policy check passed.")  # pragma: allowlist secret
          PY
      - name: Secret scan (fail closed) # pragma: allowlist secret
        run: uv run --all-groups detect-secrets-hook --baseline .secrets.baseline $(git ls-files) # pragma: allowlist secret
      - name: Verify fail-closed CI env hardening consistency
        run: | # pragma: allowlist secret
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(".github/workflows/ci-cd.yml").read_text(encoding="utf-8")
          expected_values = {
              "DATABASE_URI": "postgresql://postgres:postgres@localhost:5432/postgres",
              "MEMORY_DB_DSN": "postgresql://postgres:postgres@localhost:5432/postgres",
              "DEEPSEEK_API_KEY": "dummy-key-for-testing",
              "PROFILE_HASH_SALT": "ci-test-salt",
              "TENANT_ID": "ci-tenant",
              "FACILITY_ID": "ci-facility",
              "CLINICAL_DATA_EXTERNAL_LLM_CONSENT": "false",
          }
          forbidden_values = {
              "CLINICAL_DATA_EXTERNAL_LLM_CONSENT": "true",
              "TENANT_ID": "default-tenant",
              "FACILITY_ID": "default-facility",
          }

          env_pattern = re.compile(r"^\s{4}env:\n((?:^\s{6}[A-Z0-9_]+:.*\n)+)", re.MULTILINE)
          key_pattern = re.compile(r"^\s{6}([A-Z0-9_]+):\s*(.+?)(?:\s+#.*)?$", re.MULTILINE)

          env_blocks = []
          for match in env_pattern.finditer(text):
              block_values = {}
              for key, raw_value in key_pattern.findall(match.group(1)):
                  value = raw_value.strip().strip('"').strip("'")
                  block_values[key] = value
              env_blocks.append(block_values)

          if not env_blocks:
              print("No job env blocks found in ci-cd.yml.")
              sys.exit(1)

          for key, value in expected_values.items():
              if not any(block.get(key) == value for block in env_blocks):
                  print(f"Missing required hardening value: {key}: {value}")
                  sys.exit(1)

          for key, value in forbidden_values.items():
              if any(block.get(key) == value for block in env_blocks):
                  print(f"Found forbidden hardening value: {key}: {value}")
                  sys.exit(1)

          print("CI fail-closed env hardening consistency check passed.")
          PY
      - name: Run security checks
        run: uv run --all-groups bandit -r clinical_trial_agent agents subagents tools models -ll
      - name: Dependency vulnerability scan
        run: uv run --all-groups --with pip-audit pip-audit
      - name: Build Docker image for scanning
        run: docker build -t clinical-trial-agent:ci .
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: clinical-trial-agent:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: clinical-trial-agent:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  build-and-push:
    name: Build Docker image and push (main/tags)
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: .
          push: true
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=ci-push
          cache-to: type=gha,mode=max,scope=ci-push

  build-and-push-weekly:
    name: Build Docker image and push (weekly)
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-weekly-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Set weekly tag
        id: weekly
        run: echo "tag=weekly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Build and push weekly image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:weekly
            ${{ steps.image.outputs.name }}:${{ steps.weekly.outputs.tag }}
          cache-from: type=gha,scope=weekly-push
          cache-to: type=gha,mode=max,scope=weekly-push

  integration-weekly:
    name: Weekly integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/postgres
      MEMORY_DB_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      DEEPSEEK_API_KEY: dummy-key-for-testing
      PROFILE_HASH_SALT: ci-test-salt
      DB_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= # pragma: allowlist secret
      TENANT_ID: ci-tenant
      FACILITY_ID: ci-facility
      CLINICAL_DATA_EXTERNAL_LLM_CONSENT: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run integration tests
        run: uv run --all-groups pytest -m integration --maxfail=1 -q
