[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-agent"
version = "0.1.0"
description = "Multi-agent clinical trial matching system"
authors = [{ name = "Chris Olande", email = "olandechris@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-ollama>=0.2.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "tenacity>=8.0.0",
    "diskcache>=5.6.0",
    "async-typer>=0.0.5",
    "loguru>=0.7.2",
    "langchain-tavily>=0.2.17",
    "openai>=1.45.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.8",
    "mypy>=1.10.0",
    "vulture>=2.11",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "bandit>=1.7.5",
    "detect-secrets>=1.5.0",
    "uv",
    "radon>= 6.0.1"
]

[project.scripts]
clinical-trial-agent = "cli:app"

[tool.setuptools]
py-modules = [
    "cli",
    "clinical_trials",
    "constants",
    "config",
    "logging_config",
    "langgraph_app",
    "memory",
    "validate_env",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "models*", "prompts*", "subagents*", "tools*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["agents", "models", "prompts", "subagents", "tools", "tests"]
extend-exclude = [".jbeval", ".vincent", ".codacy", "bin"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ASYNC",
    "RUF",
    "SIM",
    "TC",
    "PTH",
    "LOG",
    "G",
]
ignore = [
    "E501",
    "B008",
    "RUF012",
    "TC003",
    "TC001",
    "TC002"
]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["clinical_trial_agent"]

[tool.ruff.lint.per-file-ignores]
"cli.py" = ["TC003"]
"clinical_trial_agent/state.py" = ["TC003"]
"clinical_trial_agent/subagents/eligibility/state.py" = ["TC003"]
"clinical_trial_agent/subagents/retrieval/state.py" = ["TC003"]
"clinical_trial_agent/subagents/synthesis/state.py" = ["TC003"]
"clinical_trial_agent/subagents/eligibility/nodes.py" = ["TC001"]
"clinical_trial_agent/subagents/retrieval/nodes.py" = ["TC001"]
"clinical_trial_agent/subagents/synthesis/nodes.py" = ["TC001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/", "evaluation/"]

[[tool.mypy.overrides]]
module = ["langchain.*", "langgraph.*", "langchain_deepseek.*", "diskcache.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests/test_supervisor.py",
    "tests/test_retrieval_nodes.py",
    "tests/test_search_refiner.py",
    "tests/test_criteria_parser.py",
    "tests/test_eligibility_reasoning.py",
    "tests/test_eligibility_nodes.py",
    "tests/test_eligibility_nodes_worker_paths.py",
    "tests/test_eligibility_fallback.py",
    "tests/test_memory_crypto.py",
    "tests/test_memory_store.py",
    "tests/test_memory_audit_feedback.py",
    "tests/test_memory_checkpointer.py",
    "tests/test_synthesis.py",
    "tests/test_trial_search_tavily.py",
    "tests/test_clinical_trials.py",
    "tests/test_llm_factory.py",
    "tests/test_config.py",
]
addopts = "--tb=short --strict-markers -q"
markers = [
    "integration: marks tests that call external APIs (deselect with -m 'not integration')",
    "slow: marks tests that take >5 seconds",
]

[tool.coverage.run]
source = [
    "agents",
    "subagents",
    "models",
    "tools",
    "memory",
    "config",
]
omit = ["tests/*", "evaluation/*", "*/migrations/*"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 65
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
