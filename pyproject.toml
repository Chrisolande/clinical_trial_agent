[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-agent"
version = "0.1.0"
description = "Multi-agent clinical trial matching system"
authors = [{ name = "Chris Olande", email = "olandechris@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "tenacity>=8.0.0",
    "diskcache>=5.6.0",
    "async-typer>=0.0.5",
    "loguru>=0.7.2",
    "langchain-tavily>=0.2.17",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "vulture>=2.11",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
]

[project.scripts]
clinical-trial-agent = "cli:app"

[tool.setuptools]
py-modules = [
    "cli",
    "clinical_trials",
    "config",
    "logging_config",
    "memory",
    "validate_env",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "models*", "prompts*", "subagents*", "tools*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["clinical_trial_agent", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ASYNC",
    "RUF",
    "SIM",
    "TCH",
    "PTH",
    "LOG",
    "G",
]
ignore = [
    "E501",
    "B008",
    "RUF012",
    "TCH003",
    "TCH001",
    "TCH002"
]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["clinical_trial_agent"]

[tool.ruff.lint.per-file-ignores]
"cli.py" = ["TCH003"]
"clinical_trial_agent/state.py" = ["TCH003"]
"clinical_trial_agent/subagents/eligibility/state.py" = ["TCH003"]
"clinical_trial_agent/subagents/retrieval/state.py" = ["TCH003"]
"clinical_trial_agent/subagents/synthesis/state.py" = ["TCH003"]
"clinical_trial_agent/subagents/eligibility/nodes.py" = ["TCH001"]
"clinical_trial_agent/subagents/retrieval/nodes.py" = ["TCH001"]
"clinical_trial_agent/subagents/synthesis/nodes.py" = ["TCH001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/", "evaluation/"]

[[tool.mypy.overrides]]
module = ["langchain.*", "langgraph.*", "langchain_deepseek.*", "diskcache.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short --strict-markers -q"
markers = [
    "integration: marks tests that call external APIs (deselect with -m 'not integration')",
    "slow: marks tests that take >5 seconds",
]

[tool.coverage.run]
source = ["clinical_trial_agent"]
omit = ["tests/*", "evaluation/*", "*/migrations/*"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
