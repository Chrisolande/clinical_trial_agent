[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-agent"
version = "0.1.0"
description = "Multi-agent clinical trial matching system"
authors = [{ name = "Chris Olande", email = "olandechris@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.84",
    "langchain-deepseek>=0.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "langchain-openai>=1.1.14",
    "langchain-anthropic>=0.2.0",
    "langchain-ollama>=0.2.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "tenacity>=8.0.0",
    "diskcache>=5.6.0",
    "async-typer>=0.0.5",
    "loguru>=0.7.2",
    "openai>=1.45.0",
    "cryptography>=46.0.7",

    # Biomedical NLP stack
    "numpy>=1.26.4,<2.0.0",
    "spacy>=3.7.4,<3.8.0",
    "thinc>=8.2.5,<8.3.0",
    "scispacy>=0.5.5,<0.6.0",
    "en-core-sci-sm @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_sm-0.5.4.tar.gz",

    "nltk>=3.9.1",
    "langsmith>=0.7.31",
    "lizard>=1.22.1",
    "scikit-learn>=1.8.0",
    "langgraph-checkpoint-postgres>=3.1.0",

    # Avoid psycopg/libpq wrapper errors on systems missing PostgreSQL client libs.
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
clinical-trial-agent = "clinical_trial_agent.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["clinical_trial_agent*", "agents*", "models*", "prompts*", "subagents*", "tools*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["clinical_trial_agent", "agents", "models", "prompts", "subagents", "tools", "tests"]
extend-exclude = [".jbeval", ".vincent", ".codacy", "bin"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ASYNC",
    "RUF",
    "SIM",
    "TC",
    "PTH",
    "LOG",
    "G",
]
ignore = [
    "E501",
    "B008",
    "RUF012",
    "TC003",
    "TC001",
    "TC002"
]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["clinical_trial_agent"]

[tool.ruff.lint.per-file-ignores]
"clinical_trial_agent/cli.py" = ["TC003"]
"clinical_trial_agent/state.py" = ["TC003"]
"clinical_trial_agent/subagents/eligibility/state.py" = ["TC003"]
"clinical_trial_agent/subagents/retrieval/state.py" = ["TC003"]
"clinical_trial_agent/subagents/synthesis/state.py" = ["TC003"]
"clinical_trial_agent/subagents/eligibility/nodes.py" = ["TC001"]
"clinical_trial_agent/subagents/retrieval/nodes.py" = ["TC001"]
"clinical_trial_agent/subagents/synthesis/nodes.py" = ["TC001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["langchain.*", "langgraph.*", "langchain_deepseek.*", "diskcache.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests/test_supervisor.py",
    "tests/test_retrieval_nodes.py",
    "tests/test_search_refiner.py",
    "tests/test_criteria_parser.py",
    "tests/test_eligibility_reasoning.py",
    "tests/test_eligibility_nodes.py",
    "tests/test_eligibility_nodes_worker_paths.py",
    "tests/test_eligibility_fallback.py",
    "tests/test_synthesis.py",
    "tests/test_clinical_trials.py",
    "tests/test_clinical_trials_core.py",
    "tests/test_clinical_trials_retry.py",
    "tests/test_clinical_trials_transport.py",
    "tests/test_consent_guard.py",
    "tests/test_config.py",
    "tests/test_patient_parser.py",
    "tests/test_missing_info.py",
    "tests/test_qa_checker.py",
    "tests/test_report_generator.py",
    "tests/test_eligibility_provider_regressions.py",
]
addopts = "--tb=short --strict-markers -q"
markers = [
    "integration: marks tests that call external APIs (deselect with -m 'not integration')",
    "slow: marks tests that take >5 seconds",
]

[tool.vulture]
paths = ["clinical_trial_agent", "agents", "subagents", "tools", "models"]
exclude = ["tests/**", ".venv/**", "docs/**"]
min_confidence = 80
ignore_names = ["cls"]

[tool.coverage.run]
source = [
    "clinical_trial_agent",
    "agents",
    "subagents",
]
omit = [
    "tests/*",
    "*/migrations/*",
    "clinical_trial_agent/cli.py",
    "clinical_trial_agent/langgraph_app.py",
    "clinical_trial_agent/logging_config.py",
    "clinical_trial_agent/normalizers.py",
    "clinical_trial_agent/state_normalizers.py",
    "agents/report_formatter.py",
    "agents/terminology.py",
    "models/eligibility.py",
    "models/terminology.py",
    "tools/cli_support.py",
]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "mypy>=1.10.0",
    "vulture>=2.16",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "bandit>=1.7.5",
    "detect-secrets>=1.5.0",
    "radon>=6.0.1",
    "langgraph-cli[inmem]>=0.4.26",
]
