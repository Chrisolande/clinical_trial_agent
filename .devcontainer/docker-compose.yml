services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.13-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/clinical_trial_agent:cached
    working_dir: /workspaces/clinical_trial_agent
    environment:
      DATABASE_URI: postgresql://postgres:postgres@db:5432/postgres # pragma: allowlist secret
      MEMORY_DB_DSN: postgresql://postgres:postgres@db:5432/postgres # pragma: allowlist secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # pragma: allowlist secret
    volumes:
      - devcontainer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devcontainer-pgdata:
